    <!-- temp - undo bootstrap  -->
    <style>
      button:focus {
        outline: none;
      }
      /* Mobile PWA / responsive safeguards */
      html, body, #root {
        min-height: 100%;
      }
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        /* Prevent horizontal overflow on narrow viewports */
        overflow-x: hidden;
      }
      /* Prevent iOS auto-zoom on input focus */
      input, select, textarea, button {
        font-size: 16px;
      }
      /* Respect safe-area insets on notched devices */
      .safe-area-inset {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* Ensure images never break the viewport */
      img, svg {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
