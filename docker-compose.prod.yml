version: '3.8'

services:
  b1admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: b1admin-prod
    ports:
      - "3101:3101"
    environment:
      - NODE_ENV=production
      - REACT_APP_STAGE=prod
      - PORT=3101
    networks:
      - b1admin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3101"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  b1admin-network:
    driver: bridge
